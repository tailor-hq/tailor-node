name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Runs first and on its own: nothing else about this repository matters if it
  # is leaking something. Scans the working tree AND the commit history, since a
  # credential removed in a later commit is still in the one that added it, and
  # rewriting history after a repository is public is far more expensive than
  # before. `fetch-depth: 0` is what makes the history half real.
  no-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/check-no-secrets.py

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor `engines.node` claims, the current LTS, and the newest.
        # A package with no dependencies has no excuse for only working on one.
        node: ['18', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Before the tests: package-shape.test.ts reads dist/ and asserts what a
      # customer receives. It skips those checks when there is no build, so an
      # unbuilt run would pass while checking nothing.
      - run: npm run build
      - run: npm test

  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm pack
      # Installing the tarball into an empty project is the only check that
      # covers the exports map, the `files` list and the declaration paths
      # together. Everything else tests the source; this tests the artifact.
      - name: install the tarball the way a customer would
        run: |
          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/tailor-ai-node-*.tgz
          node --input-type=module -e "
            import { init, TailorClient, TestResult, VERSION } from '@tailor-ai/node';
            for (const f of [init, TailorClient, TestResult]) {
              if (typeof f !== 'function') throw new Error('missing export');
            }
            if (typeof VERSION !== 'string') throw new Error('VERSION is not a string');
            console.log('import works: @tailor-ai/node ' + VERSION);
          "
          node -e "
            const { init, TailorClient, TestResult, VERSION } = require('@tailor-ai/node');
            for (const f of [init, TailorClient, TestResult]) {
              if (typeof f !== 'function') throw new Error('missing export');
            }
            console.log('require works: @tailor-ai/node ' + VERSION);
          "
